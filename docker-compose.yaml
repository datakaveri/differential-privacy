version: "3"
services:
    differential-privacy:
        container_name: iudx-differential-privacy-c
        image: iudx-differential-privacy-i
        build: .
        ports:
            - "6000:6000"
        volumes:
            - .:/app
        deploy:
          restart_policy: 
            condition: always
    middle_layer:
        container_name: iudx-differential-privacy-middle-layer-c
        image: iudx-differential-privacy-middle-layer-c
        build:
            context: ./server
            dockerfile: Dockerfile
        ports:
            - "5000:5000"
        network_mode: "host"
        deploy:
          restart_policy:
            condition: always
